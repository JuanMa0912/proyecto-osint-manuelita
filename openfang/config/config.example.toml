# ~/.openfang/config.toml — Ejemplo para el proyecto Manuelita (Modulo 3)
# Copiar a /root/.openfang/config.toml dentro de WSL (Ubuntu) y elegir UN proveedor.

api_listen = "127.0.0.1:4200"

# ───────────────────────────────────────────────────────────────
# OPCION A — Gemini (modo DEMO, recomendado: rapido y confiable)
# ───────────────────────────────────────────────────────────────
# La API key se pasa como variable de entorno GEMINI_API_KEY al lanzar el daemon
# (NO se commitea). Ver scripts/01-start-daemon.sh.
# IMPORTANTE: gemini-2.0-flash quedo con cuota free tier en 0 (HTTP 429) en jun-2026.
# Usar gemini-2.5-flash-lite (verificado con cupo) o gemini-2.5-flash.
[default_model]
provider = "gemini"
model = "gemini-2.5-flash-lite"
api_key_env = "GEMINI_API_KEY"

# ───────────────────────────────────────────────────────────────
# OPCION C — Ollama Cloud (RECOMENDADO jun-2026): GPU remota, sin GPU local, cuota
#            independiente de Gemini. VERIFICADO end-to-end con OpenFang:
#            gpt-oss:20b respondio ~1.6s, uso file_read y no alucino.
# ───────────────────────────────────────────────────────────────
# Endpoint OpenAI-compatible de Ollama Cloud -> se usa el proveedor generico "openai".
# Key gratis en ollama.com/settings/keys; se pasa como env OLLAMA_API_KEY (NO se commitea).
# base_url DEBE terminar en /v1. Free tier: limite por tiempo de GPU (sesion 5h + semanal).
# NOTA: el agente manuelita-bot ya trae este proveedor como PRIMARIO en su agent.toml
#       (override por-agente); este [default_model] es el del daemon.
# [default_model]
# provider = "openai"
# model = "gpt-oss:20b"               # otros capaces: qwen3-next:80b, gemma3:27b, gpt-oss:120b
# api_key_env = "OLLAMA_API_KEY"
# base_url = "https://ollama.com/v1"

# ───────────────────────────────────────────────────────────────
# OPCION B — Ollama local (modo SOBERANIA pura, sin nube). Reemplaza [default_model].
# ───────────────────────────────────────────────────────────────
# Requiere networking 'mirrored' en .wslconfig para que WSL alcance el Ollama de Windows.
# CRITICO: base_url DEBE terminar en /v1 (endpoint OpenAI-compatible; sin /v1 da 404 — bug #137/#212).
# Limitacion: en CPU sin GPU, llama3.2:3b tarda >2 min (el CLI corta a 120s). Usar un 1b.
#
# [default_model]
# provider = "ollama"
# model = "llama3.2:3b"          # para CPU sin GPU, considerar "llama3.2:1b"
# base_url = "http://localhost:11434/v1"
# api_key_env = ""

[memory]
decay_rate = 0.05
