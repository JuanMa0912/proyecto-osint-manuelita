# ~/.openfang/config.toml — Ejemplo para el proyecto Manuelita (Modulo 3)
# Copiar a /root/.openfang/config.toml dentro de WSL (Ubuntu) y elegir UN proveedor.

api_listen = "127.0.0.1:4200"

# Canal Telegram (token via env TELEGRAM_BOT_TOKEN, NO se commitea). Se configura con
# 'openfang channel setup telegram'. El canal resuelve el agente POR NOMBRE.
[channels.telegram]
bot_token_env = "TELEGRAM_BOT_TOKEN"
default_agent = "manuelita-bot"


# Canal WhatsApp en modo WEB (QR vía WhatsApp Web / Baileys, SIN Meta Business API).
# Requisitos: Node.js >= 18 en WSL. Al arrancar con este bloque, el binario auto-extrae el
# gateway a ~/.openfang/whatsapp-gateway y lo lanza en el puerto 3009; el QR se escanea desde
# el dashboard (Channels -> WhatsApp). (Los avisos de WHATSAPP_ACCESS_TOKEN son del modo
# Business API; se ignoran.)
#
# ⚠️ Para que RESPONDA hay que correr 'openfang/scripts/06-whatsapp-gateway.sh', que aplica
#    lo verificado en jun 2026 (v0.6.9): baileys 7.0.0-rc13 (baileys 6 cuelga el handshake),
#    install --omit=optional, y un parche LID en index.js (responder al numero real).
#
# ⚠️ default_agent DEBE ser el UUID del agente, NO el nombre: el gateway postea a
#    /api/agents/<default_agent>/message y la API rechaza el nombre con 400 "Invalid agent ID".
#    El script 06 lo pone automaticamente; aqui queda el nombre como placeholder.
[channels.whatsapp]
mode = "web"
default_agent = "manuelita-bot"  # <- el script 06 lo reemplaza por el UUID de manuelita-bot

# ───────────────────────────────────────────────────────────────
# OPCION A (ACTIVA) — Ollama Cloud gemma3:27b (RECOMENDADO jun-2026)
# ───────────────────────────────────────────────────────────────
# GPU remota -> sin GPU local y cuota INDEPENDIENTE de Gemini. VERIFICADO end-to-end con
# OpenFang: gemma3:27b respondio ~4.2s, limpio en espanol y sin fuga de razonamiento (a
# diferencia de gpt-oss:20b). Usa el proveedor generico "openai" (endpoint OpenAI-compatible).
# Key gratis en ollama.com/settings/keys
# -> env OLLAMA_API_KEY (NO se commitea). base_url DEBE terminar en /v1. Free tier por
# tiempo de GPU (reset por sesion de 5h + limite semanal).
# NOTA: los Hands built-in (collector, lead) HEREDAN este default_model. El agente
#       manuelita-bot y el Hand Custom fijan tambien Ollama Cloud en su propio manifiesto.
[default_model]
provider = "openai"
model = "gemma3:27b"                # limpio y rapido en espanol. Alt: qwen3-next:80b, gpt-oss:20b (este filtra razonamiento)
api_key_env = "OLLAMA_API_KEY"
base_url = "https://ollama.com/v1"

# ───────────────────────────────────────────────────────────────
# OPCION B — Gemini (nube). Sirve como FALLBACK del agente. Reemplaza [default_model].
# ───────────────────────────────────────────────────────────────
# Key via env GEMINI_API_KEY. gemini-2.0-flash quedo en 429 limit:0 (jun-2026); el free
# tier de 2.5-flash reventaba por RPM (cascada de 429). Usar 2.5-flash como fallback.
# [default_model]
# provider = "gemini"
# model = "gemini-2.5-flash"
# api_key_env = "GEMINI_API_KEY"

# ───────────────────────────────────────────────────────────────
# OPCION C — Ollama local (SOBERANIA pura, sin nube). Reemplaza [default_model].
# ───────────────────────────────────────────────────────────────
# Requiere networking 'mirrored' en .wslconfig para que WSL alcance el Ollama de Windows.
# CRITICO: base_url DEBE terminar en /v1 (sin /v1 da 404 — bug #137/#212).
# Limitacion: en CPU sin GPU, llama3.2:3b tarda >2 min (el CLI corta a 120s). Usar un 1b.
# [default_model]
# provider = "ollama"
# model = "llama3.2:3b"          # para CPU sin GPU, considerar "llama3.2:1b"
# base_url = "http://localhost:11434/v1"
# api_key_env = ""

[memory]
decay_rate = 0.05
